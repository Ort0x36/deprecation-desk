name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: python -m pytest -q tests/

      - name: dogfood
        # The tool has to pass its own check. Prose that names a dead model
        # carries a `depdesk: ignore` comment, which is the same escape hatch
        # users get.
        run: python -m depdesk check depdesk --fail-in 60

      - name: end to end on the sample app
        # The sample is broken on purpose: exit 2 is the pass condition here,
        # and anything else means the scanner stopped finding what it should.
        run: |
          set +e
          python -m depdesk check examples/legacy-app --fail-in 60
          code=$?
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 from the sample app, got $code"
            exit 1
          fi

  action:
    # The action is the thing most people will actually run, so it gets the
    # same treatment as the CLI: it has to fail on the broken sample and pass
    # on the package.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test the action against this checkout, not the last release
        run: python3 -m pip install --quiet .

      - id: broken
        continue-on-error: true
        uses: ./
        with:
          path: examples/legacy-app
          fail-in: "60"

      - name: The action has to fail on the broken sample
        run: |
          if [ "${{ steps.broken.outcome }}" != "failure" ]; then
            echo "the sample app is deprecated on purpose and the action passed it"
            exit 1
          fi

      - uses: ./
        with:
          path: depdesk
          fail-in: "60"
