name: ci

on:
  push:
  pull_request:
  schedule:
    # Segunda de manha: o objetivo e descobrir que a pagina do provedor mudou
    # antes do prazo, nao depois.
    - cron: "0 7 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: python -m pytest -q tests/
      - name: dogfood
        run: python -m depdesk check . --fail-in 60

  upstream:
    # So no agendamento: um push nao deveria falhar porque um provedor mexeu
    # na pagina dele.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m depdesk upstream
