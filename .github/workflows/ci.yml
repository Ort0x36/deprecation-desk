name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest
      - run: python -m pytest -q tests/

      - name: dogfood
        # The tool has to pass its own check. Prose that names a dead model
        # carries a `depdesk: ignore` comment, which is the same escape hatch
        # users get.
        run: python -m depdesk check depdesk --fail-in 60

      - name: end to end on the sample app
        # The sample is broken on purpose: exit 2 is the pass condition here,
        # and anything else means the scanner stopped finding what it should.
        run: |
          set +e
          python -m depdesk check examples/legacy-app --fail-in 60
          code=$?
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 from the sample app, got $code"
            exit 1
          fi

  action:
    # The action is the thing most people will actually run, so it gets the
    # same treatment as the CLI. Every assertion checks the exact exit code:
    # "the step failed" also passed when the step failed for the wrong reason,
    # an unknown flag or a broken install, which proved nothing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: broken
        continue-on-error: true
        uses: ./
        with:
          path: examples/legacy-app
          fail-in: "60"

      - name: The broken sample has to exit 2
        env:
          CODE: ${{ steps.broken.outputs.exit-code }}
        run: |
          if [ "$CODE" != "2" ]; then
            echo "expected exit 2 from the sample app, got '$CODE'"
            exit 1
          fi

      - uses: ./
        with:
          path: depdesk
          fail-in: "60"

      - name: A deprecation outside the window, for the runs below
        # whisper-1 retires 2027-02-26. The date is pinned with --today so
        # this does not turn into a failure the week it enters the window.
        run: |
          mkdir -p far-sample
          echo 'M = "whisper-1"' > far-sample/app.py

      - name: Outside the window it warns and passes
        uses: ./
        with:
          path: far-sample
          fail-in: "60"
          args: --today 2026-09-20

      - id: strict
        continue-on-error: true
        uses: ./
        with:
          path: far-sample
          fail-in: "60"
          # On a second line on purpose: the old parser dropped it.
          args: |
            --today 2026-09-20
            --strict

      - name: With strict the same warning has to exit 1
        env:
          CODE: ${{ steps.strict.outputs.exit-code }}
        run: |
          if [ "$CODE" != "1" ]; then
            echo "expected exit 1 under strict, got '$CODE'"
            exit 1
          fi

      - name: A released version is installed without touching the system Python
        # The version input installs with pip --target, which PEP 668 allows.
        uses: ./
        with:
          path: far-sample
          fail-in: "60"
          version: "0.2.0"
          args: --today 2026-09-20
