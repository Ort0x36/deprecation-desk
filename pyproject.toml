[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "depdesk"
version = "0.1.0"
description = "Know which of your model calls are on a clock."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Wendel Ortiz" }]
keywords = ["llm", "deprecation", "openai", "anthropic", "ci", "migration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Ort0x36/deprecation-desk"
Issues = "https://github.com/Ort0x36/deprecation-desk/issues"

[project.scripts]
depdesk = "depdesk.__main__:main"

[tool.setuptools]
packages = ["depdesk"]

[tool.setuptools.package-data]
depdesk = ["data/catalog.json"]

